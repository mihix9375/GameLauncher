<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゲームを終了</title>
    <link rel="stylesheet" href="overlay.css" />
    <script type="module" src="/overlay.js" defer></script>
  </head>
  <body>
    <button id="close-game" type="button" aria-label="ゲームを終了" title="ゲームを終了">
      <span aria-hidden="true">×</span>
    </button>
    <section id="close-confirmation" class="confirmation-layer" aria-hidden="true">
      <div class="confirmation-card" role="dialog" aria-modal="true" aria-labelledby="confirmation-title">
        <div class="confirmation-icon" aria-hidden="true">!</div>
        <p class="confirmation-label">GAME SESSION</p>
        <h1 id="confirmation-title">ゲームを終了しますか？</h1>
        <p class="confirmation-message">保存していない進行状況は失われる可能性があります。</p>
        <div class="confirmation-actions">
          <button id="confirm-cancel" class="dialog-button cancel-button" type="button">ゲームに戻る</button>
          <button id="confirm-close" class="dialog-button close-button" type="button">終了する</button>
        </div>
      </div>
    </section>
  </body>
</html>
